name: package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a stale store index
        run: python3 tools/pack.py --check

      - name: Pack one file per extension
        run: python3 tools/pack.py

      - name: Upload the store index
        uses: actions/upload-artifact@v4
        with:
          name: store
          path: |
            catalog.json
            dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pack one file per extension
        run: python3 tools/pack.py

      - name: Publish the store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release delete extensions --yes --cleanup-tag || true
          gh release create extensions \
            --target "${GITHUB_SHA}" \
            --title "Store" \
            --notes "A record in this release is listed in the store. Publishing it does not install it on a server." \
            catalog.json \
            dist/*.json \
            dist/SHA256SUMS
